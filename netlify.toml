[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Server-side AI proxy (must precede the SPA catch-all so it is not rewritten
# to index.html). Exposes provider credentials ONLY inside the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA client-side routing fallback (Vite files under /assets are served first
# because they exist on disk; this only handles HTML routes).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
