[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/remoteEntry.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Allow-Methods = "GET, HEAD, OPTIONS"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/javascript"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "frame-ancestors 'self' https://app.smartcrm.vip https://*.smartcrm.vip"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
