name: Landing Page CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          ls dist/assets/*.js dist/assets/*.css

      - name: Serverless function unit tests
        run: npm run test:functions

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Landing-page smoke test
        run: |
          npx vite preview --port 4173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then echo "preview ready"; break; fi
            sleep 1
          done
          SMOKE_URL=http://localhost:4173 npm run test:smoke
          STATUS=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $STATUS

      - name: Secret-exposure regression test (canary build)
        run: npm run test:secrets
